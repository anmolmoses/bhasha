name: bhasha
description: A language translation and grammar checking app with floating button and keyboard integration
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # HTTP client
  http: ^1.2.0

  # Zip packing/unpacking for the Sarvam Vision document-digitization job,
  # which only accepts a PDF or ZIP upload and returns its output as a ZIP.
  archive: ^3.6.1

  # Utilities
  provider: ^6.1.1
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
